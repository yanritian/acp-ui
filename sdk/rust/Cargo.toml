[package]
name = "acp-worker-sdk"
version = "0.1.0"
edition = "2021"
description = "ACP-UI Worker SDK for Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"