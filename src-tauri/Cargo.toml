[package]
name = "acp-ui"
version = "0.1.14"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "acp_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "6", features = ["macos_fsevent"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
shell-escape = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
ureq = { version = "2", features = ["json", "tls"] }  # tls uses rustls by default in ureq 2.x
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }  # NEW: For Feishu rich message API
serde_yaml = "0.9"  # NEW: For proper YAML parsing (nested structures support)

# Hermes crates - local dependencies
hermes-agent = { path = "hermes-crates/hermes-agent" }
hermes-core = { path = "hermes-crates/hermes-core" }
hermes-config = { path = "hermes-crates/hermes-config" }
hermes-tools = { path = "hermes-crates/hermes-tools" }
hermes-environments = { path = "hermes-crates/hermes-environments" }
hermes-skills = { path = "hermes-crates/hermes-skills" }
hermes-intelligence = { path = "hermes-crates/hermes-intelligence" }
hermes-memory = { path = "hermes-crates/hermes-memory" }

# `machine-uid` reads platform-specific machine identifiers and does not
# support iOS / Android. Telemetry on mobile falls back to an anonymous id.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
machine-uid = "0.5"

