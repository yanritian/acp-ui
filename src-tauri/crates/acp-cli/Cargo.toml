[package]
name = "acp-cli"
version = "0.1.0"
edition = "2021"
description = "ACP-Swarm CLI Inspector tool"
authors = ["ACP-UI Team"]

[dependencies]
acp-core = { path = "../acp-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"