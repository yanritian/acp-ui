[package]
name = "acp-core"
version = "0.1.0"
edition = "2021"
description = "ACP Protocol definitions and message types (zero internal dependencies)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }