[package]
name = "acp-transport"
version = "0.1.0"
edition = "2021"
description = "ACP Transport layer (stdio/WebSocket/HTTP)"

[dependencies]
acp-core = { path = "../acp-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["tls"] }