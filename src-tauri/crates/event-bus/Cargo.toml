[package]
name = "event-bus"
version = "0.1.0"
edition = "2021"
description = "Unified event publish/subscribe channel for Event Protocol"

[dependencies]
acp-core = { path = "../acp-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"