[package]
name = "swarm-engine"
version = "0.1.0"
edition = "2021"
description = "Swarm orchestration engine (Goal decomposition/routing/Reconcile)"

[dependencies]
acp-core = { path = "../acp-core" }
acp-transport = { path = "../acp-transport" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
ureq = { version = "2", features = ["tls"] }