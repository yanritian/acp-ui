[package]
name = "tool-sandbox"
version = "0.1.0"
edition = "2021"
description = "Tool execution sandbox with security controls"

[dependencies]
acp-core = { path = "../acp-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"