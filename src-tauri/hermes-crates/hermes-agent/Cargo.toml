[package]
name = "hermes-agent"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/nousresearch/hermes-engine"
description = "Agent loop engine for Hermes Agent"

[dependencies]
hermes-core = { path = "../hermes-core" }
hermes-config = { path = "../hermes-config" }
hermes-intelligence = { path = "../hermes-intelligence" }
hermes-tools = { path = "../hermes-tools" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "stream", "rustls-tls"] }
which = "7"
eventsource-stream = "0.2"
tokio-stream = "0.1"
async-stream = "0.3"
lazy_static = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
shlex = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
hermes-environments = { path = "../hermes-environments" }
hermes-skills = { path = "../hermes-skills" }