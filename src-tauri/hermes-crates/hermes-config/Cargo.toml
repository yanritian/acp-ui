[package]
name = "hermes-config"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/nousresearch/hermes-engine"
description = "Configuration management for Hermes Agent"

[dependencies]
hermes-core = { path = "../hermes-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
directories = "6"
url = "2"
indexmap = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
test-helpers = []

[dev-dependencies]
proptest = "1"
tempfile = "3"