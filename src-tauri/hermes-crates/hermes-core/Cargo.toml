[package]
name = "hermes-core"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/nousresearch/hermes-engine"
description = "Core types, traits, and error types for Hermes Agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
regex = "1"
url = "2"
bytes = "1"
indexmap = { version = "1", features = ["serde"] }
futures = "0.3"

[dev-dependencies]
proptest = "1"