[package]
name = "hermes-intelligence"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/nousresearch/hermes-engine"
description = "Smart router, error classifier, usage tracking, and prompt builder for Hermes Agent"

[dependencies]
hermes-core = { path = "../hermes-core" }
hermes-config = { path = "../hermes-config" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
minijinja = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
futures = "0.3"
strsim = "0.11"
dirs = "6"
tempfile = "3"

[dev-dependencies]
proptest = "1"