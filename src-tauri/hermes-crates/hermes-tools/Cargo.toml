[package]
name = "hermes-tools"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/nousresearch/hermes-engine"
description = "Tool registry, toolsets, and tool implementations for Hermes Agent"

[dependencies]
hermes-core = { path = "../hermes-core" }
hermes-config = { path = "../hermes-config" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
tokio-tungstenite = "0.24"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
serde_yaml = "0.9"
rand = "0.8"
url = "2"

[dev-dependencies]
hermes-config = { path = "../hermes-config", features = ["test-helpers"] }
proptest = "1"
tempfile = "3"